[package]
name = "fl-store"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
fl-core = { path = "../core" }
redb.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
sha2.workspace = true
ring.workspace = true
libc.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
zeroize.workspace = true
clap = { workspace = true, optional = true }

[features]
# The `ferrostore` binary and the shared clap arguments in `fl_store::cli::args`.
# On by default; a library consumer that needs neither can turn it off.
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "ferrostore"
path = "src/bin/ferrostore.rs"
required-features = ["cli"]

[[test]]
name = "ferrostore_bin"
required-features = ["cli"]

[dev-dependencies]
tempfile.workspace = true
fl-core = { path = "../core", features = ["conformance"] }
