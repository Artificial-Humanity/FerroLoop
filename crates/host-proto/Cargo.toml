[package]
name = "fl-host-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Typed host IPC messages, bounded framing, and authenticated platform transport"

[features]
# Enabled by fl-hub's dev-dependency so its test binary cannot discover a live host.
hub-test-isolation = []

[dependencies]
base64.workspace = true
getrandom = "0.2"
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "sync", "rt", "macros", "time"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# MIT OR Apache-2.0. Named-pipe DACL, first-instance flag, and the per-user mutex.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync"] }

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true
