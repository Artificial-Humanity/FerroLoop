[package]
name = "fl-wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
wire-test-isolation = ["dep:tempfile", "fl-host-proto/hub-test-isolation", "fl-store/wire-test-isolation"]

[dependencies]
tempfile = { workspace = true, optional = true }
anyhow.workspace = true
base64.workspace = true
fl-core = { path = "../core" }
fl-host-proto = { path = "../host-proto" }
fl-store = { path = "../store" }
libc.workspace = true
ring.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
socket2 = "0.6"
thiserror.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
fl-wire = { path = ".", features = ["wire-test-isolation"] }
fl-host-proto = { path = "../host-proto", features = ["hub-test-isolation"] }
tempfile.workspace = true
tokio.workspace = true
