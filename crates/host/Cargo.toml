[package]
name = "fl-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Standalone pipe-child daemon: per-session supervision and platform containment"

[[bin]]
name = "fl-host"
path = "src/main.rs"

[[bin]]
name = "fl-host-testchild"
path = "src/bin/fl-host-testchild.rs"

[dependencies]
vt100 = "=0.18.1"
fl-host-proto = { path = "../host-proto" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "sync", "rt", "rt-multi-thread", "macros", "time"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# MIT OR Apache-2.0. Creation-time Job assignment and suspended process spawn.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
fl-host-proto = { path = "../host-proto" }
serde_json.workspace = true
tempfile.workspace = true
