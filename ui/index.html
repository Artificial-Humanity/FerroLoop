<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A0D12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="FerroDeck" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <title>FerroDeck — AI-Lab-0 Command Center</title>
    <script>
      (function () {
        try {
          var t = null;
          try {
            t = window.localStorage.getItem("ferrodeck.theme");
          } catch (e) {}
          if (t !== "light" && t !== "dark") {
            t =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          }
          var r = document.documentElement;
          r.setAttribute("data-theme", t);
          r.style.backgroundColor = t === "light" ? "#F8FAFC" : "#0A0D12";
        } catch (e) {}
      })();
    </script>
  </head>
  <body
    style="
      background-color: var(--bg-canvas, #0a0d12);
      color: var(--text-primary, #f1f5f9);
      margin: 0;
    "
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
