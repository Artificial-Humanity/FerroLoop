# The verification trio, run on every pull request and on every push to `main`.
#
# AGENTS.md requires `cargo test`, a warning-free `cargo clippy --all-targets`,
# and integration checks to be green before work lands. Until this file existed
# that was enforced by nothing at all, while WORKFLOW.md said "CI runs after a
# push" — a documented guard that never ran, which is the exact defect this
# project exists to catch.
#
# On a pull request this run GATES the merge: the `main` ruleset requires the
# `test, clippy, fmt` check by name, so renaming the job below silently breaks
# the gate. The push to `main` runs the trio again on the merged result.
#
# A branch push alone does NOT trigger a run. Every branch lands through a pull
# request, so running on both events ran the same commit twice. To check a
# branch with no pull request yet, start the workflow by hand.
#
# No third-party actions are used. `actions/checkout` and
# `actions/setup-node` are GitHub's own; every other step is a command from
# the toolchain, so the supply chain for a run is the same one a local
# `cargo test` already trusts.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# Deliberately no global RUSTFLAGS: `-D warnings` there applies to
# dependencies too, so an upstream crate's warning would fail this repo's
# build for a reason nobody here can fix. The `-D warnings` that matters is
# on the clippy step, scoped to this workspace.
env:
  CARGO_TERM_COLOR: always

jobs:
  trio:
    name: test, clippy, fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record the toolchain this run used
        run: |
          rustup component add clippy rustfmt
          rustc --version
          cargo --version
          git --version

      # Formatting first: it is the cheapest to fail and the least ambiguous.
      # `cargo fmt` is deliberately not in AGENTS.md's trio, but the tree is
      # kept rustfmt-clean, so a drift here is worth seeing before a 2-minute
      # compile.
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets --workspace -- -D warnings

      # Integration tests spawn the real `fl` binary and drive real git
      # repositories in temp directories, so this step covers AGENTS.md's
      # "integration smoke checks" as well as the unit layer.
      - name: cargo test --workspace
        run: cargo test --workspace

  # Not ruleset checks. `test, clippy, fmt` above stays the required check.
  # These jobs run the host crates' real daemon and test-child subprocesses.
  # They do not log into a vendor, start an external daemon, or call inference.
  # macOS and Windows images are not promised to have rustup, so each job
  # installs Rust 1.98 with the upstream installer. No third-party action.
  host_macos:
    name: fl-host (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.98
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.98 --profile minimal --component rustfmt --component clippy
          "$HOME/.cargo/bin/rustup" toolchain install 1.98 --profile minimal --component rustfmt --component clippy
          "$HOME/.cargo/bin/rustup" default 1.98
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustc" --version
          "$HOME/.cargo/bin/cargo" --version

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy -p fl-host -p fl-host-proto --all-targets -- -D warnings
        run: cargo clippy -p fl-host -p fl-host-proto --all-targets -- -D warnings

      # GitHub's runner temp is too long for macOS sun_path (104 bytes
      # including NUL). Tests build socket paths under the process temp dir.
      - name: cargo test -p fl-host -p fl-host-proto
        env:
          TMPDIR: /tmp/flh
        run: |
          mkdir -p "$TMPDIR"
          chmod 700 "$TMPDIR"
          cargo test -p fl-host -p fl-host-proto

  host_windows:
    name: fl-host (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.98
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cargoBin = Join-Path $env:USERPROFILE '.cargo\bin'
          $init = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
          curl.exe --proto '=https' --tlsv1.2 -fsSL -o $init https://win.rustup.rs/x86_64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $init -y --default-toolchain 1.98 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rustup = Join-Path $cargoBin 'rustup.exe'
          & $rustup toolchain install 1.98 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $rustup default 1.98
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value $cargoBin
          & (Join-Path $cargoBin 'rustc.exe') --version
          & (Join-Path $cargoBin 'cargo.exe') --version

      - name: cargo fmt --all --check
        shell: bash
        run: cargo fmt --all --check

      - name: cargo clippy -p fl-host -p fl-host-proto --all-targets -- -D warnings
        shell: bash
        run: cargo clippy -p fl-host -p fl-host-proto --all-targets -- -D warnings

      - name: cargo test -p fl-host -p fl-host-proto
        shell: bash
        run: cargo test -p fl-host -p fl-host-proto

  # The FerroDeck UI in `ui/` has its own typecheck and test suite, which
  # previously ran only by hand. This job runs them on every pull request
  # and push to `main` alongside the trio above.
  #
  # Owner action: this job must become a required check in the Main
  # Protection ruleset (required status check `ui (vitest, tsc)`), as
  # `test, clippy, fmt` already is. Until that ruleset change is made this
  # job reports but does not gate the merge.
  ui:
    name: ui (vitest, tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npx tsc --noEmit -p .
        run: npx tsc --noEmit -p .

      - name: npx vitest run
        run: npx vitest run
