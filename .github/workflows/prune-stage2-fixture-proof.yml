# Manual proof: execute only after separate authorization of the installed revision.
name: prune-stage2-fixture-proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage2_fixture_proof:
    name: stage2 fixture proof (five reviewed tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8b4c5e35726faf6a13b488a22bd0a2e2b2b685b4
      - name: Verify reviewed target and record environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8b4c5e35726faf6a13b488a22bd0a2e2b2b685b4
          uname -a
          cat /etc/os-release
          printf 'Runner OS: %s; architecture: %s; image: %s %s\n' "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          rustc --version
          cargo --version
      - name: Run stage 2 fixture test 1
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          cargo test -p fl-cli --test fixture_scope fixture_scope::tests::stage2_real_provenance_envelope_and_last_owner_cleanup_ci_only -- --ignored --exact --color never | tee "$RUNNER_TEMP/prune-stage2-result-1.txt"
          grep -Fx 'test fixture_scope::tests::stage2_real_provenance_envelope_and_last_owner_cleanup_ci_only ... ok' "$RUNNER_TEMP/prune-stage2-result-1.txt"
          grep -E '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/prune-stage2-result-1.txt"
      - name: Run stage 2 fixture test 2
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          cargo test -p fl-cli --test fixture_scope fixture_scope::tests::stage2_concurrent_envelope_has_single_owner_ci_only -- --ignored --exact --color never | tee "$RUNNER_TEMP/prune-stage2-result-2.txt"
          grep -Fx 'test fixture_scope::tests::stage2_concurrent_envelope_has_single_owner_ci_only ... ok' "$RUNNER_TEMP/prune-stage2-result-2.txt"
          grep -E '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/prune-stage2-result-2.txt"
      - name: Run stage 2 fixture test 3
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          cargo test -p fl-cli --test fixture_scope fixture_scope::tests::stage2_envelope_failures_are_terminal_and_report_partial_effects_ci_only -- --ignored --exact --color never | tee "$RUNNER_TEMP/prune-stage2-result-3.txt"
          grep -Fx 'test fixture_scope::tests::stage2_envelope_failures_are_terminal_and_report_partial_effects_ci_only ... ok' "$RUNNER_TEMP/prune-stage2-result-3.txt"
          grep -E '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/prune-stage2-result-3.txt"
      - name: Run stage 2 fixture test 4
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          cargo test -p fl-cli --test fixture_scope fixture_scope::tests::stage2_changed_fixture_inputs_refuse_ci_only -- --ignored --exact --color never | tee "$RUNNER_TEMP/prune-stage2-result-4.txt"
          grep -Fx 'test fixture_scope::tests::stage2_changed_fixture_inputs_refuse_ci_only ... ok' "$RUNNER_TEMP/prune-stage2-result-4.txt"
          grep -E '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/prune-stage2-result-4.txt"
      - name: Run stage 2 fixture test 5
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          cargo test -p fl-cli --test fixture_scope fixture_scope::tests::stage2_envelope_retains_read_only_handle_ci_only -- --ignored --exact --color never | tee "$RUNNER_TEMP/prune-stage2-result-5.txt"
          grep -Fx 'test fixture_scope::tests::stage2_envelope_retains_read_only_handle_ci_only ... ok' "$RUNNER_TEMP/prune-stage2-result-5.txt"
          grep -E '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/prune-stage2-result-5.txt"
