[workspace]
members = ["crates/core", "crates/store", "crates/exec", "crates/cli"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.104"
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
redb = "4.3.0"
clap = { version = "4.6.7", features = ["derive"] }
walkdir = "2.5.0"
globset = "0.4.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time"] }
tempfile = "3.27.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"
uuid = { version = "1.26", features = ["v7"] }
toml = "1.1"
