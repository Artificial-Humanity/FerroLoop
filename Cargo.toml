[workspace]
members = ["crates/core", "crates/store", "crates/exec", "crates/cli", "crates/github", "crates/mcp", "crates/wire", "crates/hub", "crates/gate", "crates/watch", "crates/install", "crates/browse", "crates/host-proto", "crates/host", "crates/vendor-adapters"]
# Standalone repositories mounted as git submodules; optional, never built from here.
exclude = ["submodules"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.104"
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive"] }
# ⚠ Never enable `preserve_order`: the GitHub ledger reads a line only when
# re-encoding it gives the same bytes, which needs a `Value`'s keys sorted.
# `ledger::layout::tests::json_objects_encode_with_their_keys_sorted` guards it.
serde_json = "1.0.151"
redb = "4.3.0"
clap = { version = "4.6.7", features = ["derive"] }
walkdir = "2.5.0"
globset = "0.4.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time"] }
tempfile = "3.27.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"
uuid = { version = "1.26", features = ["v7"] }
toml = "1.1"
sha2 = "0.10"
semver = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
ureq = { version = "3.4", features = ["json"] }
ring = "0.17"
base64 = "0.22"
libc = "0.2"
tiny_http = "0.12"
toml_edit = "0.25"
indexmap = { version = "2.14", features = ["serde"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1.15"
webpki-roots = "1.0"
zeroize = "1.9"
# MIT (zurawiki/tiktoken-rs): o200k_base BPE for the counted token-savings ledger.
# No default features: the optional async-openai integration stays out.
tiktoken-rs = { version = "0.12.1", default-features = false }

[profile.dev.package.sha2]
opt-level = 3
