system_id = "ferroloop"
title = "FerroLoop"
strict_coverage = true

[[components]]
id = "fl_core"
title = "Core Domain"
kind = "crate"
description = "Pure domain model, state, workflow, PR policy, FerroWire, vendor child-environment allow-lists, and architecture conformance"
package = "fl-core"
paths = ["crates/core/**"]

[[components]]
id = "fl_store"
title = "Redb Store"
kind = "store"
description = "Durable local redb persistence for catalog, ledger, state, wire, and workflows"
package = "fl-store"
paths = ["crates/store/**"]

[[components]]
id = "fl_github"
title = "GitHub Tracker & Ledger"
kind = "crate"
description = "GitHub issue tracker, pull-request inspector, and append-only ledger client"
package = "fl-github"
paths = ["crates/github/**"]

[[components]]
id = "fl_mcp"
title = "MCP Catalog"
kind = "crate"
description = "Committed MCP server catalog and vendor configuration writer"
package = "fl-mcp"
paths = ["crates/mcp/**"]

[[components]]
id = "fl_exec"
title = "Execution & Workflow Engine"
kind = "crate"
description = "Gate runner, five-vendor CLI adapters, git state sync, and workflow step executor"
package = "fl-exec"
paths = ["crates/exec/**"]

[[components]]
id = "fl_wire"
title = "FerroWire Bus"
kind = "crate"
description = "Agent identity resolution, Unix socket / WebSocket relay, and push delivery"
package = "fl-wire"
paths = ["crates/wire/**"]

[[components]]
id = "fl_hub"
title = "FerroLoop Hub"
kind = "service"
description = "HTTP/1.1 & WebSocket daemon, two-tier auth, host discovery, and /api/v1 REST API"
package = "fl-hub"
paths = ["crates/hub/**"]

[[components]]
id = "fl_gate"
title = "FerroGate Vault & MCP Gateway"
kind = "crate"
description = "Zero-knowledge AES-256-GCM secret vault, credential proxy, declarative API-to-MCP gateway, local MCP registry, and event bridge"
package = "fl-gate"
paths = ["crates/gate/**"]

[[components]]
id = "fl_watch"
title = "FerroWatch Observability"
kind = "crate"
description = "Standalone telemetry rollups, agent liveness health, and threshold alerting over a FerroLoop store"
package = "fl-watch"
paths = ["crates/watch/**"]

[[components]]
id = "fl_browse"
title = "FerroBrowse"
kind = "crate"
description = "Token-efficient accessibility snapshot of a web page (native HTML distiller, optional headless browser binary) and the UI and accessibility gate auditor behind fl browse"
package = "fl-browse"
paths = ["crates/browse/**"]

[[components]]
id = "fl_install"
title = "Installer I/O"
kind = "crate"
description = "The I/O side of the installer: the read-only host probe behind install planning, doctor observation (receipt, owned paths, vault modes, UI build info), and the transactional install (lock, journal, staging, verification, the atomic switch of current, receipt, resume and rollback)"
package = "fl-install"
paths = ["crates/install/**"]

[[components]]
id = "fl_host_proto"
title = "Host Protocol"
kind = "crate"
description = "Typed host IPC messages, bounded framing, and authenticated platform transport"
package = "fl-host-proto"
paths = ["crates/host-proto/**"]

[[components]]
id = "fl_host"
title = "Native Agent Host"
kind = "service"
description = "Standalone pipe-child daemon: per-session supervision, survivor registry, and platform containment"
package = "fl-host"
paths = ["crates/host/**"]

[[components]]
id = "fl_vendor_adapters"
title = "Vendor Host Adapters"
kind = "crate"
description = "Concrete VendorHostAdapter implementations composed at fl-cli"
package = "fl-vendor-adapters"
paths = ["crates/vendor-adapters/**"]

[[components]]
id = "fl_cli"
title = "FerroLoop CLI"
kind = "crate"
description = "Unified fl command-line interface and agent-msg / MCP entrypoints"
package = "fl-cli"
paths = ["crates/cli/**"]

[[components]]
id = "ferrodeck_ui"
title = "FerroDeck UI"
kind = "ui"
description = "Browser-based command center SPA served by fl-hub"
paths = ["ui/**"]

[[edges]]
from = "fl_store"
to = "fl_core"
label = "persists domain types and implements store traits"

[[edges]]
from = "fl_github"
to = "fl_core"
label = "implements tracker, ledger, and PR policy traits"

[[edges]]
from = "fl_exec"
to = "fl_core"
label = "executes gates, adapters, state sync, and workflow graphs"

[[edges]]
from = "fl_wire"
to = "fl_core"
label = "uses FerroWire domain types and agent registry"

[[edges]]
from = "fl_wire"
to = "fl_store"
label = "persists and queries messages in RedbStore"

[[edges]]
from = "fl_gate"
to = "fl_core"
label = "uses core timestamps, IRIs, and error primitives while remaining standalone"

[[edges]]
from = "fl_hub"
to = "fl_gate"
label = "exposes /api/v1/gate vault, connector, registry, and webhook bridge endpoints"

[[edges]]
from = "fl_cli"
to = "fl_gate"
label = "runs fl vault / fl gateway CLI subcommands and MCP server"

[[edges]]
from = "fl_hub"
to = "fl_core"
label = "serves domain types and evaluates architecture conformance"

[[edges]]
from = "fl_hub"
to = "fl_store"
label = "opens RedbStore for REST and WebSocket handlers"

[[edges]]
from = "fl_hub"
to = "fl_exec"
label = "drives workflow runs and step transitions"

[[edges]]
from = "fl_hub"
to = "fl_github"
label = "inspects and reviews GitHub pull requests"

[[edges]]
from = "fl_hub"
to = "fl_wire"
label = "discovers agent routes and dispatches FerroWire messages"

[[edges]]
from = "fl_cli"
to = "fl_core"
label = "dispatches CLI commands over core domain types"

[[edges]]
from = "fl_cli"
to = "fl_store"
label = "opens local and workspace RedbStore databases"

[[edges]]
from = "fl_cli"
to = "fl_exec"
label = "runs gates, adapters, state sync, and workflows"

[[edges]]
from = "fl_cli"
to = "fl_github"
label = "connects to GitHub tracker, ledger, and PR endpoints"

[[edges]]
from = "fl_cli"
to = "fl_mcp"
label = "manages project MCP server catalogs"

[[edges]]
from = "fl_cli"
to = "fl_wire"
label = "runs FerroWire CLI and daemon subcommands"

[[edges]]
from = "fl_cli"
to = "fl_hub"
label = "runs fl hub and fl arch subcommands"

[[edges]]
from = "ferrodeck_ui"
to = "fl_hub"
label = "consumes /api/v1 REST API and /ws/v1 WebSocket stream"

[[edges]]
from = "fl_watch"
to = "fl_core"
label = "reads ledger, catalog, and runtime state through core traits and reuses core liveness and regret evaluation"

[[edges]]
from = "fl_watch"
to = "fl_store"
label = "reads the AnyStore it is handed: attempt and gate-run rows, once per report"

[[edges]]
from = "fl_hub"
to = "fl_watch"
label = "serves /api/v1/watch summary, alerts, and rollups with discovered vendor quota"

[[edges]]
from = "fl_cli"
to = "fl_watch"
label = "runs fl watch status, rollups, liveness, and alerts"

[[edges]]
from = "fl_cli"
to = "fl_browse"
label = "runs fl browse snapshot, check, and doctor"

[[edges]]
from = "fl_install"
to = "fl_core"
label = "feeds the pure install planner and doctor engine the facts they judge"

[[edges]]
from = "fl_cli"
to = "fl_install"
label = "runs fl install (plan, apply, resume, rollback) and fl doctor over the host probe"

[[edges]]
from = "fl_hub"
to = "fl_install"
label = "serves GET /api/v1/doctor and the UI build-info reader"

[[edges]]
from = "fl_hub"
to = "fl_mcp"
label = "serves GET /api/v1/mcp/catalog and POST /api/v1/mcp/sync over the committed MCP catalog"

[[edges]]
from = "fl_host"
to = "fl_host_proto"
label = "speaks the authenticated host protocol and reuses its endpoint identity"

[[edges]]
from = "fl_wire"
to = "fl_host_proto"
label = "discovers and dispatches to native fl-host sessions"

[[edges]]
from = "fl_hub"
to = "fl_host_proto"
label = "supervises hosted agent sessions and boot reconciliation through fl-host"

[[edges]]
from = "fl_cli"
to = "fl_host"
label = "runs fl host serve and internal supervisor/containment worker entrypoints"

[[edges]]
from = "fl_cli"
to = "fl_host_proto"
label = "connects to fl-host for status, list, capture, send, and kill CLI subcommands"

[[edges]]
from = "fl_vendor_adapters"
to = "fl_core"
label = "implements VendorHostAdapter and RuntimePort domain contracts"

[[edges]]
from = "fl_cli"
to = "fl_vendor_adapters"
label = "composes concrete vendor host adapters into the runtime registry"


